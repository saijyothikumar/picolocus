services:
  - type: web
    name: picolocus-demo
    env: static
    buildCommand: npm ci && npm run build && npm run scan && npm run build:demo
    staticPublishPath: ./sandbox/demo-saas/dist
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
