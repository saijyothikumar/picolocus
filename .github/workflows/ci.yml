name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'

jobs:
  verify:
    name: Node ${{ matrix.node-version }} Verification Gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security vulnerability audit
        run: npm audit --audit-level=high

      - name: Build SDK packages
        run: npm run build

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Run unit test suite
        run: npm test

      - name: Scan & compile manifests
        run: npm run scan

      - name: Verify zero RBAC leaks
        run: npm run verify

      - name: Download model weights for tests
        run: node scripts/download-model.mjs

      - name: Evaluate golden test queries
        run: npm run test:queries -- --require-onnx

      - name: Golden model & RAM smoke gate
        run: npm run smoke:model -- --require-onnx

      - name: Build demo SaaS distribution
        run: npm run build:demo

      - name: Package SDK tarballs
        run: npm run pack:sdk

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E integration tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7
