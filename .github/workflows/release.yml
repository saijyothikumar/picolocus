name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish in dry-run mode'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security vulnerability audit
        run: npm audit --audit-level=high

      - name: Build and verify all packages
        run: |
          npm run build
          npm run verify:versions
          npm run typecheck
          npm test
          npm run scan
          npm run verify

      - name: Pack SDK tarballs
        run: npm run pack:sdk

      - name: Upload SDK Tarballs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picolocus-sdk-tarballs
          path: release/*.tgz

      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          mkdir -p release/dry-run-logs
          echo "### NPM Dry-Run Verification" >> $GITHUB_STEP_SUMMARY
          WHO=$(npm whoami --registry=https://registry.npmjs.org/ 2>&1) || true
          echo "NPM whoami output: \`$WHO\`" >> $GITHUB_STEP_SUMMARY
          npm publish --workspace=@picolocus/core --access public --dry-run
          npm publish --workspace=@picolocus/cli --access public --dry-run
          npm publish --workspace=@picolocus/web --access public --dry-run
          npm publish --workspace=@picolocus/onnx --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || (github.event_name != 'workflow_dispatch' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))) }}
        run: |
          mkdir -p release/publish-logs
          echo "### NPM Publish Run Summary" >> $GITHUB_STEP_SUMMARY
          
          WHO=$(npm whoami --registry=https://registry.npmjs.org/ 2>&1) || true
          echo "Authenticated NPM user: \`$WHO\`" >> $GITHUB_STEP_SUMMARY
          echo "::warning title=NPM Whoami::$WHO"
          
          for pkg in core cli web onnx; do
            echo "--- Publishing @picolocus/$pkg ---"
            OUTPUT=$(npm publish --workspace=@picolocus/$pkg --access public --provenance 2>&1)
            STATUS=$?
            echo "$OUTPUT" > "release/publish-logs/$pkg.log"
            echo "$OUTPUT"
            
            if [ $STATUS -eq 0 ]; then
              echo "- :white_check_mark: Published \`@picolocus/$pkg\`" >> $GITHUB_STEP_SUMMARY
              echo "::notice title=Published @picolocus/$pkg::Successfully published @picolocus/$pkg"
            else
              echo "- :x: Failed to publish \`@picolocus/$pkg\`" >> $GITHUB_STEP_SUMMARY
              CLEAN_ERR=$(echo "$OUTPUT" | tr '\r\n' ' ')
              echo "::error title=Publish Error @picolocus/$pkg::$CLEAN_ERR"
              exit 1
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload Publish Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picolocus-publish-logs
          path: release/publish-logs/*.log

      - name: Attach tarballs to GitHub Release
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz

      - name: Fast-forward releases branch
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git config user.name "Sai Jyothi Kumar"
          git config user.email "saikumarjyo14@gmail.com"
          git push origin ${{ github.sha }}:refs/heads/releases --force
