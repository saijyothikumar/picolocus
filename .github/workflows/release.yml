name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish in dry-run mode'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security vulnerability audit
        run: npm audit --audit-level=high

      - name: Build and verify all packages
        run: |
          npm run build
          npm run typecheck
          npm test
          npm run scan
          npm run verify

      - name: Pack SDK tarballs
        run: npm run pack:sdk

      - name: Upload SDK Tarballs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picolocus-sdk-tarballs
          path: release/*.tgz

      - name: Publish to npm (Dry Run)
        if: ${{ inputs.dry_run }}
        run: |
          npm publish --workspace=@picolocus/core --access public --dry-run
          npm publish --workspace=@picolocus/cli --access public --dry-run
          npm publish --workspace=@picolocus/web --access public --dry-run
          npm publish --workspace=@picolocus/onnx --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || (github.event_name != 'workflow_dispatch' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v'))) }}
        run: |
          npm publish --workspace=@picolocus/core --access public --provenance
          npm publish --workspace=@picolocus/cli --access public --provenance
          npm publish --workspace=@picolocus/web --access public --provenance
          npm publish --workspace=@picolocus/onnx --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach tarballs to GitHub Release
        if: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz
