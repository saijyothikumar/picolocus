name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'sandbox/demo-saas/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK packages
        run: npm run build

      - name: Scan & compile manifests
        run: npm run scan

      - name: Setup GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Download model weights for demo
        run: node scripts/download-model.mjs

      - name: Build demo workbench for production
        run: npm run build:demo
        env:
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'sandbox/demo-saas/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
